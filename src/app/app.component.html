<div style="padding: 20px;">
  <h1 style="margin-bottom: 20px;">Gestión de Divisiones</h1> <!-- Título de la sección -->

  <div style="margin-bottom: 20px;">
    <input
      nz-input
      placeholder="Buscar división por nombre..."
      [(ngModel)]="searchValue"
      (ngModelChange)="filterData()"
      style="width: 350px;"
    />
  </div>

  <nz-table #menuTable [nzData]="divisionesFiltradas" nzTableLayout="fixed">
    <!-- Cabeceras Tabla -->
    <thead>
      <tr>
        <th>División</th>
        <th>División Superior</th>
        <th nzWidth="120px">Nivel</th>
        <th nzWidth="150px">Colaboradores</th>
        <th nzWidth="150px">Subdivisiones</th>
        <th>Embajador</th>
      </tr>
    </thead>

    <!-- Cuerpo Tabla -->
    <tbody>
      <tr *ngFor="let d of divisionesFiltradas">
        <!-- Nombre de la división -->
        <td style="font-weight: bold; color: #1890ff;">{{ d.nombre }}</td>
        
        <!-- Nombre del padre o guion si es raíz -->
        <td>{{ d.padre?.nombre || '-' }}</td>
        
        <!-- Nivel jerárquico - Calculado -->
        <td>{{ d.nivel }}</td>
        
        <!-- Totales Colaboradores - Calculado -->
        <td>{{ d.totalColaboradores || 0 }}</td>
        
        <!-- Totales Subdivisiones - Calculado -->
        <td>
          {{ d.totalSubdivisiones || 0 }}
          <span
            nz-icon
            nzType="plus-circle"
            nzTheme="outline"
            style="color: #1890ff; margin-left: 8px; cursor: pointer;">
          </span>
        </td>
        
        <!-- Embajador asignado -->
        <td>{{ d.embajador || 'Sin asignar' }}</td>
      </tr>
    </tbody>
  </nz-table>
</div>
